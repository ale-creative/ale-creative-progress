<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿乐的创作进度卡</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ef;color:#333;font-family:system-ui,-apple-system,sans-serif}main{max-width:680px;margin:auto;padding:24px 16px 48px}header{padding:18px 4px}h1{font-size:28px;margin:0 0 10px}p{line-height:1.7}.muted{color:#777;font-size:14px}.card{background:#fff;border:1px solid #e7e1d8;border-radius:16px;padding:18px;margin:14px 0}label{display:block;margin:12px 0 6px;font-size:14px}input,textarea,select{width:100%;padding:12px;border:1px solid #ddd7cf;border-radius:10px;font:inherit;background:#fff}button{border:0;border-radius:10px;padding:12px 16px;background:#454d3c;color:white;font:inherit;cursor:pointer}.secondary{background:#eeeae3;color:#333}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.stats{display:flex;gap:8px}.stat{background:#f5f2eb;border-radius:12px;padding:12px;flex:1}.stat strong{font-size:23px;display:block}.progress{height:9px;background:#eee;border-radius:20px;overflow:hidden;margin:14px 0}#bar{height:100%;width:0;background:#8a9a72;transition:width .2s}.task{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.task input{width:20px;height:20px}.task span{flex:1;overflow-wrap:anywhere}.task button{padding:6px 10px;background:#eee;color:#555}.task.done span{text-decoration:line-through;color:#999}footer{text-align:center;color:#888;font-size:12px;padding:20px}
</style>
</head>
<body><main>
<header><p class="muted">ALE · PERSONAL CREATIVE SPACE</p><h1>阿乐的创作进度卡 ✍️</h1><p>不求每天做很多，只把走过的路记录下来。</p></header>
<section class="card"><h2>今天想做什么？</h2><label for="date">日期</label><input id="date" type="date"><label for="category">创作类别</label><select id="category"><option>表情包创作</option><option>公众号写作</option><option>音乐与灵感</option><option>学习与成长</option><option>生活记录</option></select><label for="taskInput">准备完成的事情</label><input id="taskInput" placeholder="例如：完成一张表情包"><button id="add" style="width:100%;margin-top:12px">＋ 添加任务</button></section>
<section class="card"><h2>今日进度</h2><div class="stats"><div class="stat"><strong id="total">0</strong><small>总任务</small></div><div class="stat"><strong id="completed">0</strong><small>已完成</small></div><div class="stat"><strong id="percent">0%</strong><small>完成率</small></div></div><div class="progress"><div id="bar"></div></div><div id="tasks"></div><p id="empty" class="muted">今天的第一件事，可以从这里开始。</p></section>
<section class="card"><h2>今天的感受</h2><label for="mood">此刻的状态</label><select id="mood"><option>状态不错</option><option>平平常常</option><option>有点疲惫</option><option>暂时不想努力</option><option>有新的灵感</option></select><label for="note">留给自己的几句话</label><textarea id="note" rows="4" placeholder="今天做了什么？有什么想法？"></textarea><p class="muted">记录自动保存在当前浏览器；建议定期下载备份。</p></section>
<section class="card"><h2>生成分享图片</h2><p class="muted">把今天的创作进度和感受生成一张图片，方便保存或发朋友圈。</p><button id="makeImage" style="width:100%">生成报喜卡图片</button><p class="muted">生成后可预览并下载 PNG 图片。</p><div id="imagePreview" style="display:none;margin-top:12px"><img id="shareImage" alt="创作报喜卡预览" style="width:100%;border-radius:12px;border:1px solid #e7e1d8"><button id="downloadImage" style="width:100%;margin-top:10px">下载图片</button></div></section>
<section class="card"><h2>备份与恢复</h2><p class="muted">换设备前，建议先下载备份文件。</p><div class="row"><button id="export">下载备份</button><button id="importBtn" class="secondary">导入备份</button></div><input id="file" type="file" accept=".json,application/json" hidden></section>
<footer>阿乐的生活札记 · 慢慢创作，持续记录</footer>
</main>
<script>
const $=id=>document.getElementById(id),KEY='ale-creative-progress-v1';let data={tasks:[],mood:'状态不错',note:''};
function load(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.tasks))data=saved}catch(e){}}
function save(){data.mood=$('mood').value;data.note=$('note').value;try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('浏览器暂时无法保存，请下载备份。')}}
function render(){$('tasks').innerHTML='';data.tasks.forEach((t,i)=>{const item=document.createElement('div');item.className='task'+(t.done?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.setAttribute('aria-label','完成任务');cb.onchange=()=>{t.done=cb.checked;save();render()};const span=document.createElement('span');span.textContent=t.text+' · '+t.category;const del=document.createElement('button');del.textContent='删除';del.onclick=()=>{data.tasks.splice(i,1);save();render()};item.append(cb,span,del);$('tasks').append(item)});const total=data.tasks.length,done=data.tasks.filter(t=>t.done).length,pct=total?Math.round(done/total*100):0;$('total').textContent=total;$('completed').textContent=done;$('percent').textContent=pct+'%';$('bar').style.width=pct+'%';$('empty').hidden=total>0}
function refresh(){save();render()}
load();$('date').value=new Date().toLocaleDateString('sv-SE');$('mood').value=data.mood||'状态不错';$('note').value=data.note||'';
$('add').onclick=()=>{const text=$('taskInput').value.trim();if(!text){alert('先写下一件准备做的事吧！');return}data.tasks.push({text,category:$('category').value,done:false});$('taskInput').value='';save();render()};
$('mood').onchange=refresh;$('note').oninput=save;
$('export').onclick=()=>{save();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='阿乐创作进度备份.json';a.click();URL.revokeObjectURL(url)};

function makeShareImage(){
 save();
 const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
 canvas.width=1080;canvas.height=1350;
 const bg=ctx.createLinearGradient(0,0,1080,1350);bg.addColorStop(0,'#f8f4e8');bg.addColorStop(1,'#f3f0df');ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1350);
 ctx.fillStyle='#dfe8d2';ctx.beginPath();ctx.roundRect(64,64,952,1222,30);ctx.fill();
 ctx.fillStyle='#f9f7ee';ctx.beginPath();ctx.roundRect(82,82,916,1186,24);ctx.fill();
 ctx.fillStyle='#72876b';ctx.font='30px system-ui,sans-serif';ctx.fillText('阿乐的创作小记',112,150);
 ctx.fillStyle='#244f3d';ctx.font='bold 58px system-ui,sans-serif';ctx.fillText('阿乐的表达报喜卡',112,242);
 ctx.fillStyle='#72876b';ctx.font='30px system-ui,sans-serif';ctx.fillText($('date').value||new Date().toLocaleDateString('zh-CN'),112,300);
 ctx.fillStyle='#e2ebd6';ctx.beginPath();ctx.roundRect(112,344,856,94,18);ctx.fill();
 ctx.fillStyle='#285640';ctx.font='bold 34px system-ui,sans-serif';ctx.fillText('本次发布 · '+$('category').value,140,404);
 const total=data.tasks.length,done=data.tasks.filter(t=>t.done).length,pct=total?Math.round(done/total*100):0;
 ctx.fillStyle='#72876b';ctx.font='30px system-ui,sans-serif';ctx.fillText('今日任务',112,510);ctx.fillText('已完成',570,510);
 ctx.fillStyle='#244f3d';ctx.font='bold 76px system-ui,sans-serif';ctx.fillText(String(total)+' 条',112,600);ctx.fillText(String(done)+' 条',570,600);
 ctx.fillStyle='#e2e8d8';ctx.beginPath();ctx.roundRect(112,640,856,22,12);ctx.fill();
 ctx.fillStyle='#789b62';ctx.beginPath();ctx.roundRect(112,640,856*pct/100,22,12);ctx.fill();
 ctx.fillStyle='#72876b';ctx.font='28px system-ui,sans-serif';ctx.fillText('完成率 '+pct+'%',112,704);
 ctx.fillStyle='#244f3d';ctx.font='bold 34px system-ui,sans-serif';ctx.fillText('这次表达，我的感受是：',112,790);
 ctx.fillStyle='#365c49';ctx.font='30px system-ui,sans-serif';
 const note=($('note').value||'今天也为自己留下一点记录。').trim();
 const lines=[];let line='';
 for(const ch of note){if(ctx.measureText(line+ch).width>820){lines.push(line);line=ch;}else line+=ch;}if(line)lines.push(line);
 lines.slice(0,7).forEach((ln,i)=>ctx.fillText(ln,112,850+i*48));
 ctx.strokeStyle='#d7e1ce';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(112,1170);ctx.lineTo(968,1170);ctx.stroke();
 ctx.fillStyle='#72876b';ctx.font='26px system-ui,sans-serif';ctx.fillText('先留下一点进展，下一步可以慢慢来。',112,1220);
 const img=$('shareImage');img.src=canvas.toDataURL('image/png');$('imagePreview').style.display='block';window.shareCardDataUrl=img.src;
}
$('makeImage').onclick=makeShareImage;
$('downloadImage').onclick=()=>{if(!window.shareCardDataUrl){makeShareImage();}const a=document.createElement('a');a.href=window.shareCardDataUrl;a.download='阿乐的表达报喜卡.png';document.body.appendChild(a);a.click();a.remove()};

$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.tasks))throw Error();if(!confirm('导入会替换当前记录，确定继续吗？'))return;data=d;$('mood').value=data.mood||'状态不错';$('note').value=data.note||'';save();render();alert('恢复成功！')}catch(err){alert('文件格式不正确，请选择之前下载的备份文件。')}e.target.value=''};render();
</script></body></html>
